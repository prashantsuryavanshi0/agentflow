# =====================================================================
# Hasura metadata — tables, relationships, computed fields, and BOTH
# permission layers.
#
# Every authenticated request carries a single Hasura role: "user".
# Row-level differentiation between owner / editor / viewer happens
# INSIDE each permission's boolean filter by joining to org_members
# through relationships — this is Layer 1 (org + role scoping).
#
# Layer 2 (step-level gating) is partially expressed here for the
# obviously-declarative cases (who may INSERT a db_write / notify /
# webhook-trigger row) and is otherwise enforced in application code
# inside the triggerWorkflowRun / approveStep Action handlers, per
# the assignment's note that the approval-gate decision is mid-
# execution and can't be a plain row permission.
# =====================================================================

- table:
    name: organizations
    schema: public
  array_relationships:
    - name: members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            name: org_members
            schema: public
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            name: workflows
            schema: public
  select_permissions:
    - role: user
      permission:
        columns: [id, name, quota_period_start, quota_calls_allowed, quota_calls_used, created_at, updated_at]
        filter:
          members:
            user_id:
              _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns: [name]
        filter:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
        check: null

- table:
    name: org_members
    schema: public
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: user
      using:
        foreign_key_constraint_on: user_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, user_id, role]
        check:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
  update_permissions:
    - role: user
      permission:
        columns: [role]
        filter:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }

- table:
    name: workflows
    schema: public
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: latest_run
      using:
        manual_configuration:
          remote_table:
            name: workflow_latest_run
            schema: public
          column_mapping:
            id: workflow_id
  array_relationships:
    - name: steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_steps
            schema: public
    - name: triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_triggers
            schema: public
    - name: runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_runs
            schema: public
  computed_fields:
    - name: avg_run_duration_seconds
      definition:
        function:
          name: workflow_avg_run_duration_seconds
          schema: public
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
        computed_fields: [avg_run_duration_seconds]
        filter:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, name, description, is_active]
        check:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }
        set:
          created_by: x-hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns: [name, description, is_active]
        filter:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }

- table:
    name: workflow_steps
    schema: public
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
    - name: org
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, org_id, step_order, type, name, config, created_at]
        filter:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id