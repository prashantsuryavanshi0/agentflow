actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_BASE_URL}}/actions/trigger-workflow-run'
      forward_client_headers: true
      headers:
        - name: x-agentflow-action-secret
          value_from_env: ACTION_SECRET
      timeout: 120
    permissions:
      - role: user

  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_BASE_URL}}/actions/approve-step'
      forward_client_headers: true
      headers:
        - name: x-agentflow-action-secret
          value_from_env: ACTION_SECRET
      timeout: 60
    permissions:
      - role: user

  - name: createOrganization
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_BASE_URL}}/actions/create-organization'
      forward_client_headers: true
      headers:
        - name: x-agentflow-action-secret
          value_from_env: ACTION_SECRET
      timeout: 30
    permissions:
      - role: user